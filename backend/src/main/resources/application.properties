server.port=8080

spring.datasource.url=jdbc:sqlite:./memory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.app-name=memory-assistant-java
app.ollama-base-url=http://127.0.0.1:11434
app.deepseek-base-url=https://api.deepseek.com
app.deepseek-api-key=${DEEPSEEK_API_KEY:}
app.deepseek-model=deepseek-flash
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.recent-turns-limit=6
app.memory-limit=5
app.memory-decay-enabled=true
app.memory-decay-interval-days=30
app.memory-decay-factor=0.08
app.low-confidence-threshold=0.35
app.expiring-soon-days=7
app.ongoing-task-ttl-days=45
